site_name: radie_jsonui
site_description: Static site generator that turns JSON into Bootstrap 5 documentation sites
site_url: https://github.com/radiece/radie_jsonui
repo_url: https://github.com/radiece/radie_jsonui
repo_name: radiece/radie_jsonui

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Usage: usage.md
  - Contributing: contributing.md
  - Changelog: changelog.md
  - License: license.md
