[project]
name = "radie-jsonui"
version = "0.1.0"
description = "Static site generator that turns JSON into Bootstrap 5 documentation sites with hot reload, minification, and offline support"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jinto AG", email = "radiece@gmail.com"},
]
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "jsonschema>=4.23.0",
    "markdown>=3.10",
    "pydantic>=2.12.5",
    "rich>=14.2.0",
    "typer>=0.20.0",
    "watchfiles>=0.24.0",
    "beautifulsoup4>=4.12.3",
    "minify-html>=0.15.0",
    "csscompressor>=0.9.5",
    "httpx>=0.27.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing :: Markup :: HTML",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

keywords = [
    "static-site-generator",
    "documentation",
    "json",
    "bootstrap",
    "html",
    "markdown",
    "jinja2",
    "hot-reload",
    "minification",
]

[project.urls]
Homepage = "https://github.com/radiece/radie_jsonui"
Repository = "https://github.com/radiece/radie_jsonui"
Issues = "https://github.com/radiece/radie_jsonui/issues"
Documentation = "https://github.com/radiece/radie_jsonui/blob/main/USAGE.md"
Changelog = "https://github.com/radiece/radie_jsonui/releases"

[project.scripts]
radie_jsonui = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25.11.0",
    "isort>=7.0.0",
    "mypy>=1.18.2",
    "pyright>=1.1.407",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.6",
    "types-jsonschema>=4.25.1.20251009",
    "types-markdown>=3.10.0.20251106",
    "flake8>=7.1.1",
    "mkdocs>=1.6.1",
    "click-man>=0.5.1",
    "pre-commit>=4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=src --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=90"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
disallow_subclassing_any = false
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "B904", "SIM102", "SIM117"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100
